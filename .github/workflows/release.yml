# Cuts a release from a version tag (KTD5): the build job produces the plugin zip with no
# write access; the release job (the only one that can write) publishes it and commits the
# marketplace entry, and runs no code from the project beyond scripts/update-marketplace.mjs.
name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of ${DEFAULT_BRANCH}; merge it first, then tag the merged commit."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Called directly, not through `npm run release:build`: its banners would pollute stdout,
      # which is the one JSON line {zip, sha256, version} the release job reads.
      - name: Build the plugin zip
        run: |
          node scripts/build-plugin.mjs --tag "$GITHUB_REF_NAME" > build-result.json
          cat build-result.json
          mkdir release-assets
          cp build-result.json release-assets/
          cp dist-release/subzero-*.zip dist-release/subzero-*.zip.sha256 release-assets/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-release
          path: release-assets
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-release
          path: release-assets

      - name: Create the release with the zip attached
        run: |
          set -euo pipefail
          version="$(jq -r .version release-assets/build-result.json)"
          sha256="$(jq -r .sha256 release-assets/build-result.json)"
          zip="release-assets/subzero-${version}.zip"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::the tag is ${GITHUB_REF_NAME} but the built version is ${version}"
            exit 1
          fi
          echo "${sha256}  ${zip}" | sha256sum -c -
          flags=()
          case "$version" in
            *-preview*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$zip" "${zip}.sha256" \
            --verify-tag --title "subzero ${version}" --generate-notes "${flags[@]}"

      - name: Point the marketplace at the release
        run: |
          set -euo pipefail
          version="$(jq -r .version release-assets/build-result.json)"
          sha256="$(jq -r .sha256 release-assets/build-result.json)"
          node scripts/update-marketplace.mjs --version "$version" --sha256 "$sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "The marketplace already points at v${version}."
            exit 0
          fi
          git commit -m "chore(release): point the marketplace at v${version}"
          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
